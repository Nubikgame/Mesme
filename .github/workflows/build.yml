name: Build Mesme APK

on:
  workflow_dispatch:

jobs:
 build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Build APK
        working-directory: frontend
        run: |
          flet build apk --project mesme --product "Mesme"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mesme-APK
          path: |
            frontend/build/apk/**/*.apk
            frontend/build/**/**/*.apk